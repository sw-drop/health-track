version: '3.8'

services:
  health:
    build: ./health_api
    container_name: health
    volumes:
      - ./html:/html:rw
    environment:
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=my-org
      - INFLUX_BUCKET=health
    restart: unless-stopped
    networks:
      - global_infra

    labels:
      - io.portainer.accesscontrol.users=agent
  health_ingest:
    build: ./health_ingest
    container_name: health_ingest
    volumes:
      - ./Apple_Health:/data
    environment:
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=my-org
      - INFLUX_BUCKET=health
    restart: unless-stopped
    networks:
      - global_infra

    labels:
      - io.portainer.accesscontrol.users=agent
networks:
  global_infra:
    external: true
