version: '3.8'

services:
  health_influxdb:
    image: influxdb:2.7
    container_name: health_influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword
      - DOCKER_INFLUXDB_INIT_ORG=my-org
      - DOCKER_INFLUXDB_INIT_BUCKET=health
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-auth-token
    restart: unless-stopped

  health_grafana:
    image: grafana/grafana:latest
    container_name: health_grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - health_influxdb
    restart: unless-stopped

  health_ingest:
    build: ./health_ingest
    container_name: health_ingest
    volumes:
      - ./Apple_Health:/data:ro
    environment:
      - INFLUX_URL=http://health_influxdb:8086
      - INFLUX_TOKEN=my-super-secret-auth-token
      - INFLUX_ORG=my-org
      - INFLUX_BUCKET=health
    depends_on:
      - health_influxdb
    # This container runs once and exits. We don't restart it automatically.
    restart: "no"

volumes:
  influxdb-data:
  grafana-data:
