<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
</head>
<body>
    <!-- PIN Overlay -->
    <div id="pin-overlay" class="pin-overlay">
        <div class="pin-box">
            <h2>Enter PIN</h2>
            <p>Please unlock the dashboard to view health data.</p>
            <input type="password" id="pin-input" placeholder="••••" maxlength="4" autocomplete="off">
            <button id="pin-submit">Unlock</button>
            <div id="pin-error" class="pin-error"></div>
        </div>
    </div>

    <div id="main-content" style="display: none;">
        <header>
        <h1>Health Dashboard</h1>
        <div class="controls time-controls">
            <button class="pill-btn time-btn" data-range="1W">1W</button>
            <button class="pill-btn time-btn active" data-range="1M">1M</button>
            <button class="pill-btn time-btn" data-range="6M">6M</button>
            <button class="pill-btn time-btn" data-range="1Y">1Y</button>
            <button class="pill-btn time-btn" data-range="ALL">ALL</button>
            <a href="health_data_summary.html?v=4" target="_blank" class="pill-btn" style="text-decoration: none; display: inline-block; line-height: 1.2;">Data Census</a>
        </div>
    </header>

    <div class="tabs-container">
        <button class="tab-btn active" data-tab="Overview">Overview</button>
        <button class="tab-btn" data-tab="Activity">Activity & Energy</button>
        <button class="tab-btn" data-tab="Sleep">Sleep & Rest</button>
        <button class="tab-btn" data-tab="Vitals">Vitals & Heart</button>
        <button class="tab-btn" data-tab="Mobility">Mobility & Gait</button>
        <button class="tab-btn" data-tab="Body">Body Measurements</button>
        <button class="tab-btn" data-tab="Stand">Stand</button>
        <button class="tab-btn" data-tab="Environment">Environment</button>
        <button class="tab-btn" data-tab="Other">Other</button>
    </div>
    
    <div id="loading" class="loading">Discovering Apple Health metrics from database...</div>
    
    <div class="dashboard-grid" id="dashboard-grid">
        <!-- Dynamic panels will be injected here -->
    </div>
    </div> <!-- Close main-content -->

    <script src="app.js?v=2"></script>
</body>
</html>
