<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Hub Dashboard</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❤️</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
    <div class="dashboard-container">
        <header class="header card">
            <div class="header-content">
                <div class="logo">
                    <h1>Health Hub</h1>
                </div>
                <div class="user-profile">
                    <button id="edit-data-btn" class="btn-outline">Edit Data</button>
                    <span>Gary</span>
                    <div class="avatar">G</div>
                </div>
            </div>
        </header>

        <main class="grid-container">
            <!-- Main Chart Area -->
            <section class="main-chart-card card">
                <div class="card-header">
                    <div>
                        <h2>Weight Tracker</h2>
                        <div class="current-stat" id="current-weight">-- kg</div>
                    </div>
                    <div class="time-filters">
                        <button class="time-filter" data-range="7">7D</button>
                        <button class="time-filter" data-range="30">30D</button>
                        <button class="time-filter active" data-range="90">90D</button>
                        <button class="time-filter" data-range="365">1Y</button>
                        <button class="time-filter" data-range="all">MAX</button>
                    </div>
                </div>
                <div class="chart-container">
                    <canvas id="weightChart"></canvas>
                </div>
            </section>

            <!-- Smaller Stat Cards -->
            <section class="stat-cards">
                <div class="stat-card card">
                    <h3>Body Fat %</h3>
                    <div class="stat-value" id="current-body-fat">--%</div>
                    <div class="chart-container-mini">
                        <canvas id="bodyFatChart"></canvas>
                    </div>
                </div>
                
                <div class="stat-card card">
                    <h3>BMI</h3>
                    <div class="stat-value" id="current-bmi">--</div>
                    <div class="chart-container-mini">
                        <canvas id="bmiChart"></canvas>
                    </div>
                </div>
                
                <div class="stat-card card">
                    <h3>Visceral Fat</h3>
                    <div class="stat-value" id="current-visceral">--</div>
                    <div class="chart-container-mini">
                        <canvas id="visceralChart"></canvas>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Edit Data Modal -->
    <div id="edit-modal" class="modal hidden">
        <div class="modal-content card">
            <div class="modal-header">
                <h2>Manage Data Records</h2>
                <button id="close-modal-btn" class="btn-close">&times;</button>
            </div>
            <div class="modal-body">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Date / Time</th>
                            <th>Weight (kg)</th>
                            <th>Fat %</th>
                            <th>Visceral</th>
                            <th>BMI</th>
                            <th>Actions</th>
                        </tr>
                        <tr id="add-record-row">
                            <td style="font-size:0.8rem; font-weight:bold;"><input type="datetime-local" id="new-datetime" style="padding: 2px; max-width: 125px;"></td>
                            <td><input type="number" step="0.1" id="new-weight" style="width: 55px; padding: 2px;" placeholder="kg"></td>
                            <td><input type="number" step="0.1" id="new-fat" style="width: 55px; padding: 2px;" placeholder="%"></td>
                            <td><input type="number" step="0.1" id="new-visceral" style="width: 55px; padding: 2px;" placeholder="Lvl"></td>
                            <td><input type="number" step="0.1" id="new-bmi" style="width: 55px; padding: 2px;" placeholder="BMI"></td>
                            <td><button class="btn-sm" style="background:#10b981; color:white; font-weight:bold;" onclick="addRecord()">Add</button></td>
                        </tr>
                    </thead>
                    <tbody id="data-table-body">
                        <!-- Rows injected via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="app.js?v=11"></script>
</body>
</html>
